<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mishkat — a niche holding a lamp in a glass that shines like a brilliant star (Quran 24:35)">
  <defs>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a4d"/>
      <stop offset="1" stop-color="#0a1022"/>
    </linearGradient>
    <radialGradient id="glass" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".35" stop-color="#ffe9a3"/>
      <stop offset=".75" stop-color="#f2b84b" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c98a22" stop-opacity=".35"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd66b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#d9962a"/>
    </linearGradient>
  </defs>
  <!-- the niche (mishkat) -->
  <path d="M22 110 V56 C22 30 40 14 60 8 C80 14 98 30 98 56 V110 Z" fill="url(#niche)" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M31 110 V58 C31 38 44 25 60 20 C76 25 89 38 89 58 V110" fill="none" stroke="#ffd66b" stroke-opacity=".28" stroke-width="1.5"/>
  <!-- light -->
  <circle cx="60" cy="64" r="36" fill="url(#halo)"/>
  <g stroke="#ffd66b" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round">
    <path d="M60 30 V38"/><path d="M36 64 H28"/><path d="M84 64 H92"/><path d="M43 47 L38 42"/><path d="M77 47 L82 42"/><path d="M43 81 L38 86"/><path d="M77 81 L82 86"/>
  </g>
  <!-- chain -->
  <path d="M60 20 V44" stroke="url(#gold)" stroke-width="2"/>
  <!-- the glass (zujaja), shining like a brilliant star -->
  <circle cx="60" cy="64" r="17" fill="url(#glass)" stroke="#ffe39a" stroke-width="1.5"/>
  <path d="M60 51 L62.6 61.4 L73 64 L62.6 66.6 L60 77 L57.4 66.6 L47 64 L57.4 61.4 Z" fill="#ffffff" opacity=".92"/>
  <!-- the lamp (misbah): collar and base -->
  <path d="M53 46 H67 L64 49 H56 Z" fill="url(#gold)"/>
  <path d="M49 81 C52 87 68 87 71 81 Z" fill="url(#gold)"/>
  <!-- the blessed olive tree -->
  <g fill="#8fbf7a" opacity=".9">
    <path d="M40 104 C33 100 31 94 33 89 C39 92 41 98 40 104 Z"/>
    <path d="M80 104 C87 100 89 94 87 89 C81 92 79 98 80 104 Z"/>
  </g>
  <path d="M40 104 Q60 96 80 104" stroke="#8fbf7a" stroke-width="1.6" fill="none" opacity=".8"/>
</svg>
