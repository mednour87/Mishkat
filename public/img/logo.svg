<svg class="lamp lmp2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Mishkat — light upon light (24:35)">
  <defs>
    <!-- light upon light: soft stacked halos -->
    <radialGradient id="lmp2h" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/><stop offset=".35" stop-color="#ffe2a0" stop-opacity=".45"/><stop offset=".7" stop-color="#ffc861" stop-opacity=".14"/><stop offset="1" stop-color="#ffc861" stop-opacity="0"/></radialGradient>
    <!-- the planet «كوكب دري»: a pearl-white sphere behind the glass -->
    <radialGradient id="lmp2p" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fffdf4" stop-opacity=".55"/><stop offset=".55" stop-color="#ffe9b8" stop-opacity=".16"/><stop offset="1" stop-color="#d9a84a" stop-opacity=".05"/></radialGradient>
    <!-- the glass (زجاجة) -->
    <linearGradient id="lmp2v" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff8e0" stop-opacity=".5"/><stop offset=".35" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".7" stop-color="#fff3cc" stop-opacity=".08"/><stop offset="1" stop-color="#ffe7a6" stop-opacity=".42"/></linearGradient>
    <!-- the olive oil «يكاد زيتها يضيء ولو لم تمسسه نار»: it glows by itself, no flame -->
    <linearGradient id="lmp2o" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a6"/><stop offset=".3" stop-color="#f0cc3a"/><stop offset=".72" stop-color="#c49c16"/><stop offset="1" stop-color="#857f1c"/></linearGradient>
    <radialGradient id="lmp2c" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff4b0" stop-opacity=".4"/><stop offset="1" stop-color="#fff4b0" stop-opacity="0"/></radialGradient>
    <linearGradient id="lmp2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#f0c45a"/><stop offset="1" stop-color="#b8862a"/></linearGradient>
    <linearGradient id="lmp2n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14203f"/><stop offset="1" stop-color="#060a18"/></linearGradient>
    <linearGradient id="lmp2l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbf7e"/><stop offset="1" stop-color="#5d8545"/></linearGradient>
    <!-- neon: a wide soft glow under a thin bright core -->
    <filter id="lmp2f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="lmp2s" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="lmp2b"><path d="M54.5 37 C42 40 36.5 50 37.5 61 C38.5 71 46 78.5 54 79.5 L66 79.5 C74 78.5 81.5 71 82.5 61 C83.5 50 78 40 65.5 37 Z"/></clipPath>
  </defs>
  <style>
    .lmp2 .h1{animation:lmp2a 7s ease-in-out infinite}
    .lmp2 .h2{animation:lmp2a 7s ease-in-out infinite 2.3s}
    .lmp2 .oil{animation:lmp2k 5.5s ease-in-out infinite 1s}
    .lmp2 .neon{animation:lmp2k 6s ease-in-out infinite}
    .lmp2 .star{animation:lmp2s 8s ease-in-out infinite;transform-origin:60px 60px}
    @keyframes lmp2a{0%,100%{opacity:.78}50%{opacity:1}}
    @keyframes lmp2k{0%,100%{opacity:.88}50%{opacity:1}}
    @keyframes lmp2s{0%,100%{opacity:.6;transform:scale(.97)}50%{opacity:.9;transform:scale(1.02)}}
    @media (prefers-reduced-motion:reduce){.lmp2 *{animation:none!important}}</style>

  <!-- the niche (مشكاة) — a pointed mihrab arch with a double gold line -->
  <path d="M13 115 V55 C13 29 34 10 60 4 C86 10 107 29 107 55 V115 Z" fill="url(#lmp2n)" stroke="url(#lmp2g)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M18.5 112 V56 C18.5 33 37 17 60 11 C83 17 101.5 33 101.5 56 V112" fill="none" stroke="#f0c45a" stroke-width=".7" opacity=".5"/>
  <!-- slender columns of the mihrab: capitals and bases -->
  <g fill="#e8bd55" opacity=".85"><rect x="16.6" y="54" width="4" height="1.6" rx=".5"/><rect x="99.4" y="54" width="4" height="1.6" rx=".5"/>
    <rect x="16.6" y="109.5" width="4" height="1.6" rx=".5"/><rect x="99.4" y="109.5" width="4" height="1.6" rx=".5"/></g>
  <path d="M14.5 113.5 H105.5" stroke="url(#lmp2g)" stroke-width="1" opacity=".75"/>

  <!-- «نور على نور»: the light filling the niche -->
  <circle class="h1" cx="60" cy="58" r="46" fill="url(#lmp2h)"/>
  <circle class="h2" cx="60" cy="61" r="31" fill="url(#lmp2h)"/>

  <!-- soft rays of the shining star — blurred, like light through mist -->
  <g class="star" filter="url(#lmp2s)">
    <path d="M60 16 L61.6 54 L60 60 L58.4 54 Z M60 104 L58.4 68 L60 60 L61.6 68 Z M18 60 L54 58.4 L60 60 L54 61.6 Z M102 60 L66 61.6 L60 60 L66 58.4 Z" fill="#fff8e2" opacity="1"/>
    <path d="M33 33 L56 56 L60 60 L55 57.5 Z M87 33 L64 56 L60 60 L65 57.5 Z M33 87 L56 64 L60 60 L55 62.5 Z M87 87 L64 64 L60 60 L65 62.5 Z" fill="#ffeec4" opacity=".75"/>
  </g>

  <!-- the planet «كأنها كوكب دري»: its own sphere and neon outline, behind the glass -->
  <g class="neon" filter="url(#lmp2f)">
    <circle cx="60" cy="61" r="29.5" fill="url(#lmp2p)" stroke="#fff3d6" stroke-width="1" stroke-opacity=".9"/>
    <path d="M30.8 64 C40 71.5 80 71.5 89.2 64" fill="none" stroke="#fff3d6" stroke-width=".6" opacity=".55"/>
    <path d="M60 31.5 C49 41 49 81 60 90.5" fill="none" stroke="#fff3d6" stroke-width=".5" opacity=".35"/>
  </g>

  <!-- the glass vessel: flared neck, round body, small foot (a mosque lamp), drawn as a neon tube -->
  <g clip-path="url(#lmp2b)">
    <!-- olive oil fills most of the glass -->
    <rect class="oil" x="34" y="47" width="52" height="36" fill="url(#lmp2o)"/>
    <ellipse class="oil" cx="60" cy="59" rx="14" ry="9" fill="url(#lmp2c)"/>
    <path d="M36 47.2 Q60 44.6 84 47.2" fill="none" stroke="#ffffff" stroke-width="1" opacity=".9"/>
  </g>
  <path d="M47.5 22.5 H72.5 C70 28 66 31.5 65.5 37 C78 40 83.5 50 82.5 61 C81.5 71 74 78.5 66 79.5 L68.5 85 H51.5 L54 79.5 C46 78.5 38.5 71 37.5 61 C36.5 50 42 40 54.5 37 C54 31.5 50 28 47.5 22.5 Z" fill="url(#lmp2v)"/>
  <g class="neon" filter="url(#lmp2f)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M47.5 22.5 H72.5 C70 28 66 31.5 65.5 37 C78 40 83.5 50 82.5 61 C81.5 71 74 78.5 66 79.5 L68.5 85 H51.5 L54 79.5 C46 78.5 38.5 71 37.5 61 C36.5 50 42 40 54.5 37 C54 31.5 50 28 47.5 22.5 Z" stroke="#ffd36e" stroke-width="2.2"/>
    <path d="M47.5 22.5 H72.5 C70 28 66 31.5 65.5 37 C78 40 83.5 50 82.5 61 C81.5 71 74 78.5 66 79.5 L68.5 85 H51.5 L54 79.5 C46 78.5 38.5 71 37.5 61 C36.5 50 42 40 54.5 37 C54 31.5 50 28 47.5 22.5 Z" stroke="#fffaf0" stroke-width=".8"/>
    <!-- reflections on the glass -->
    <path d="M44 50 C41.5 55 41.5 63 44.5 69" stroke="#ffffff" stroke-width="1.5" opacity=".9"/>
    <path d="M53 25.5 C54.5 29 56 31.5 56.5 35" stroke="#ffffff" stroke-width=".9" opacity=".75"/>
  </g>
  <circle cx="74" cy="47" r="1.2" fill="#ffffff"/>

  <!-- a small olive sprig, centred: «لا شرقية ولا غربية» -->
  <g transform="translate(60 101)">
    <path d="M-18 4 Q0 -3 18 4" fill="none" stroke="#c9a253" stroke-width="1.1" stroke-linecap="round"/>
    <g fill="url(#lmp2l)" stroke="#d8e6c4" stroke-width=".35">
      <path d="M0 0 C3.5 -2 9 -2 12 0 C9 2 3.5 2 0 0 Z" transform="translate(-14 1.8) rotate(-38)"/>
      <path d="M0 0 C3.5 -2 9 -2 12 0 C9 2 3.5 2 0 0 Z" transform="translate(-6 -.6) rotate(-62)"/>
      <path d="M0 0 C3.5 -2 9 -2 12 0 C9 2 3.5 2 0 0 Z" transform="translate(6 -.6) rotate(-118)"/>
      <path d="M0 0 C3.5 -2 9 -2 12 0 C9 2 3.5 2 0 0 Z" transform="translate(14 1.8) rotate(-142)"/>
      <path d="M0 0 C3 -1.7 7.5 -1.7 10 0 C7.5 1.7 3 1.7 0 0 Z" transform="translate(-10 1.8) rotate(28)"/>
      <path d="M0 0 C3 -1.7 7.5 -1.7 10 0 C7.5 1.7 3 1.7 0 0 Z" transform="translate(10 1.8) rotate(152)"/>
    </g>
    <ellipse cx="-3" cy="3.6" rx="1.9" ry="2.4" fill="#5b6e2a" stroke="#d6c26a" stroke-width=".4"/>
    <ellipse cx="3" cy="3.6" rx="1.9" ry="2.4" fill="#5b6e2a" stroke="#d6c26a" stroke-width=".4"/>
    <circle cx="-3.6" cy="2.7" r=".5" fill="#fff"/><circle cx="2.4" cy="2.7" r=".5" fill="#fff"/>
  </g>
</svg>
