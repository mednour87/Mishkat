<svg xmlns="http://www.w3.org/2000/svg" class="lamp lmp1" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Mishkat — light upon light (24:35)">
  <defs>
    <radialGradient id="lmp1h" cx="50%" cy="54%" r="50%"><stop offset="0" stop-color="#ffd66b" stop-opacity=".55"/><stop offset="1" stop-color="#ffd66b" stop-opacity="0"/></radialGradient>
    <radialGradient id="lmp1s" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffe6a6" stop-opacity=".75"/><stop offset=".75" stop-color="#e9a73d" stop-opacity=".45"/><stop offset="1" stop-color="#8a5a12" stop-opacity=".35"/></radialGradient>
    <radialGradient id="lmp1b" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#fffdf5"/><stop offset=".6" stop-color="#fff0c2"/><stop offset="1" stop-color="#ffd27a"/></radialGradient>
    <linearGradient id="lmp1g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe39a"/><stop offset="1" stop-color="#d9962a"/></linearGradient>
    <linearGradient id="lmp1n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a4d"/><stop offset="1" stop-color="#0a1022"/></linearGradient>
  </defs>
  <style>
    .lmp1 .l1{animation:lmp1a 4.8s ease-in-out infinite}
    .lmp1 .l2{animation:lmp1a 4.8s ease-in-out infinite .6s}
    .lmp1 .l3{animation:lmp1a 4.8s ease-in-out infinite 1.2s}
    .lmp1 .l4{animation:lmp1a 4.8s ease-in-out infinite 1.8s}
    .lmp1 .flame{animation:lmp1f 1.6s ease-in-out infinite alternate;transform-origin:60px 70px}
    @keyframes lmp1a{0%,100%{opacity:.35}35%{opacity:1}60%{opacity:.75}}
    @keyframes lmp1f{from{transform:scale(.94,1)}to{transform:scale(1.06,1.08)}}
    @media (prefers-reduced-motion:reduce){.lmp1 *{animation:none!important}}</style>
  <!-- niche (مشكاة) -->
  <path d="M14 114 V54 C14 28 34 10 60 5 C86 10 106 28 106 54 V114 Z" fill="url(#lmp1n)" stroke="url(#lmp1g)" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- light upon light: four halos, each one lighting up in turn -->
  <circle class="l4" cx="60" cy="64" r="46" fill="url(#lmp1h)"/>
  <circle class="l3" cx="60" cy="64" r="36" fill="url(#lmp1h)"/>
  <!-- chain -->
  <path d="M60 12 V22" stroke="url(#lmp1g)" stroke-width="1.8"/>
  <!-- the planet-like glass sphere (كوكب دري) with an orbit ring -->
  <ellipse class="l3" cx="60" cy="64" rx="40" ry="9" fill="none" stroke="#ffe39a" stroke-opacity=".45" stroke-width="1.2" transform="rotate(-14 60 64)"/>
  <circle class="l2" cx="60" cy="64" r="32" fill="url(#lmp1s)" stroke="#ffe39a" stroke-width="1.6"/>
  <path d="M33 56 Q60 49 87 56" stroke="#fff6dc" stroke-opacity=".28" stroke-width="1.2" fill="none"/>
  <path d="M31 70 Q60 78 89 70" stroke="#fff6dc" stroke-opacity=".22" stroke-width="1.2" fill="none"/>
  <!-- the lamp: a glass bottle (زجاجة) holding the flame (مصباح) -->
  <path class="l1" d="M52 34 h16 v7 c0 3 11 7 11 21 v13 c0 9 -8 13 -19 13 c-11 0 -19 -4 -19 -13 v-13 c0 -14 11 -18 11 -21 z"
        fill="url(#lmp1b)" stroke="#fff3cf" stroke-width="1.4" opacity=".92"/>
  <rect x="50" y="30" width="20" height="5" rx="2" fill="url(#lmp1g)"/>
  <path class="flame" d="M60 54 C66 62 66 70 60 76 C54 70 54 62 60 54 Z" fill="#fff" opacity=".95"/>
            <path class="flame" d="M60 60 C63 65 63 70 60 73 C57 70 57 65 60 60 Z" fill="#ffb24a"/>
  <!-- the blessed olive branches -->
  <g fill="#8fbf7a" opacity=".9"><path d="M30 108 C24 104 22 98 24 93 C30 96 32 102 30 108 Z"/><path d="M90 108 C96 104 98 98 96 93 C90 96 88 102 90 108 Z"/></g>
</svg>