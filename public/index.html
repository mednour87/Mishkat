<main id="work">
  <!-- left column (right in Arabic): the galaxy above, the Mushaf below -->
  <div class="col col-main">
    <section id="gzone" class="zone" aria-labelledby="gTitle">
      <h2 id="gTitle" class="sr" data-i18n="zGalaxy">المجرّة</h2>
      <canvas id="galaxy" aria-label="Quran galaxy"></canvas>
      <div id="tooltip" role="tooltip"></div>
      <!-- camera: turn and tilt (click = one step, hold = continuous), in a corner far from the middle -->
      <div id="gcam" role="group" data-i18n-aria="camera">
        <button type="button" data-cam="up" data-i18n-title="camUp" data-i18n-aria="camUp">▲</button>
        <button type="button" data-cam="left" data-i18n-title="camLeft" data-i18n-aria="camLeft">◀</button>
        <button type="button" data-cam="right" data-i18n-title="camRight" data-i18n-aria="camRight">▶</button>
        <button type="button" data-cam="down" data-i18n-title="camDown" data-i18n-aria="camDown">▼</button>
      </div>
      <aside id="lampDock" aria-live="off">
        <div id="lampSlot"></div>
        <div id="lampRef"></div>
        <div id="hud" hidden></div>
      </aside>
      <!-- the galaxy toolbar: on a phone only ⌂, the shape, ⤢ and ⋯ are shown; ⋯ unfolds the other tools -->
      <div id="gtools" role="toolbar" data-i18n-aria="gTools">
        <button id="gMore" class="gmore" aria-expanded="false" data-i18n-title="gMore" data-i18n-aria="gMore">⋯</button>
        <button id="gHome" data-i18n-title="home" data-i18n-aria="home">⌂</button>
        <button id="gIn" data-i18n-title="zoomIn" data-i18n-aria="zoomIn">＋</button>
        <button id="gOut" data-i18n-title="zoomOut" data-i18n-aria="zoomOut">－</button>
        <button id="gRot" data-i18n-title="rotate" data-i18n-aria="rotate" aria-pressed="true">⟲</button>
        <button id="gNames" data-i18n-title="suraNames" data-i18n-aria="suraNames" aria-pressed="true">ﺱ</button>
        <label class="viewpick" data-i18n-title="shapeKey"><span class="vk" aria-hidden="true">◈</span><span class="sr" data-i18n="shapeLabel">الشكل</span><select id="shapeSel"></select></label>
        <label class="viewpick" data-i18n-title="orderKey"><span class="vk" aria-hidden="true">⇅</span><span class="sr" data-i18n="orderLabel">الترتيب</span><select id="orderSel"></select></label>
        <button id="gLegend" data-i18n-title="legend" data-i18n-aria="legend" aria-expanded="false">◐</button>
        <button id="gFull" data-i18n-title="expandG" data-i18n-aria="expandG" aria-pressed="false">⤢</button>
      </div>
      <div id="legendBox" hidden></div>
      <section id="suggest" aria-labelledby="sgTitle">
        <button id="sgClose" class="icon sg-x" data-i18n-aria="closeSuggest" data-i18n-title="closeSuggest">✕</button>
        <h2 id="sgTitle" class="sr" data-i18n="suggestTitle">اقتراحات</h2>
        <div id="viewHome"></div>
      </section>
      <button id="sgOpen" class="sg-open" hidden><span aria-hidden="true">✦</span> <span data-i18n="suggestTitle">اقتراحات</span></button>
      <div id="viewNote" hidden></div>

    <div class="split" id="splitMain" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-aria="resize"></div>
    <section id="rzone" class="zone" aria-labelledby="rTitle"><h2 id="rTitle" class="sr" data-i18n="zReader">المصحف</h2><div id="viewRead"></div></section>

        <button id="resClose" class="icon" data-i18n-aria="clearRes" data-i18n-title="clearRes">✕</button>
